name: Build existing Android app from Snake source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract and build existing Android project
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Snake repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platforms and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Extract source and read its original build settings
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/AURA-Standalone-Android-Source.zip"
          test -f "$ARCHIVE" || { echo "Source archive is missing: $ARCHIVE"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ARCHIVE" -d "$GITHUB_WORKSPACE/extracted"

          echo "===== ARCHIVE FILES ====="
          find "$GITHUB_WORKSPACE/extracted" -type f -printf '%P\n' | sort | tee "$GITHUB_WORKSPACE/source-files.txt"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Gradle settings file found in the existing source archive."
            exit 2
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found existing Gradle project: $PROJECT_DIR"

          echo "===== ORIGINAL ROOT BUILD FILE ====="
          sed -n '1,200p' "$PROJECT_DIR/build.gradle.kts"
          echo "===== ORIGINAL APP BUILD FILE ====="
          sed -n '1,240p' "$PROJECT_DIR/app/build.gradle.kts"

          ORIGINAL_WORKFLOW="$PROJECT_DIR/.github/workflows/build-apk.yml"
          GRADLE_VERSION="8.9"
          if [ -f "$ORIGINAL_WORKFLOW" ]; then
            echo "===== ORIGINAL PROJECT APK WORKFLOW ====="
            cat "$ORIGINAL_WORKFLOW"
            DETECTED_VERSION="$(grep -m1 'gradle-version:' "$ORIGINAL_WORKFLOW" | sed -E 's/.*gradle-version:[[:space:]]*//; s/["'\'' ]//g' || true)"
            if [ -n "$DETECTED_VERSION" ]; then
              GRADLE_VERSION="$DETECTED_VERSION"
            fi
          fi
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"
          echo "Using Gradle version specified by the source project: $GRADLE_VERSION"

      - name: Enable BuildConfig generation required by the existing app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          project_dir = Path(os.environ["PROJECT_DIR"])
          gradle_file = project_dir / "app" / "build.gradle.kts"
          source = gradle_file.read_text(encoding="utf-8")

          if "buildConfig = true" not in source:
              marker = "android {"
              if marker not in source:
                  raise SystemExit("Could not find the Android Gradle configuration block.")
              source = source.replace(
                  marker,
                  marker + "\n    buildFeatures {\n        buildConfig = true\n    }\n",
                  1,
              )
              gradle_file.write_text(source, encoding="utf-8")

          if "buildConfig = true" not in gradle_file.read_text(encoding="utf-8"):
              raise SystemExit("BuildConfig generation was not enabled.")
          print("Enabled BuildConfig generation in the extracted build copy.")
          PY

      - name: Download and verify Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GRADLE_VERSION" != "8.9" ]; then
            echo "No pinned checksum is configured for the source project's Gradle $GRADLE_VERSION."
            exit 3
          fi

          EXPECTED_SHA256="d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab"
          ZIP_PATH="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"
          INSTALL_DIR="$RUNNER_TEMP/gradle"

          echo "Downloading Gradle $GRADLE_VERSION from the verified distribution mirror..."
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "https://repo.huaweicloud.com/gradle/gradle-$GRADLE_VERSION-bin.zip" \
            --output "$ZIP_PATH"

          echo "$EXPECTED_SHA256  $ZIP_PATH" | sha256sum --check --status
          echo "Gradle distribution checksum verified."

          mkdir -p "$INSTALL_DIR"
          unzip -q "$ZIP_PATH" -d "$INSTALL_DIR"
          echo "$INSTALL_DIR/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
          "$INSTALL_DIR/gradle-$GRADLE_VERSION/bin/gradle" --version

      - name: Create temporary debug signing key when needed
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build existing debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload the existing app APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-existing-app-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source inventory for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Snake-source-inventory
          path: source-files.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload extracted project source for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Snake-extracted-project-source
          path: extracted/
          if-no-files-found: error
          retention-days: 7
