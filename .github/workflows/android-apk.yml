name: Build existing Android app from Snake source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract and build existing Android project
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Snake repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platforms and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Extract source and read its original build settings
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/AURA-Standalone-Android-Source.zip"
          test -f "$ARCHIVE" || { echo "Source archive is missing: $ARCHIVE"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ARCHIVE" -d "$GITHUB_WORKSPACE/extracted"

          echo "===== ARCHIVE FILES ====="
          find "$GITHUB_WORKSPACE/extracted" -type f -printf '%P\n' | sort | tee "$GITHUB_WORKSPACE/source-files.txt"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Gradle settings file found in the existing source archive."
            exit 2
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found existing Gradle project: $PROJECT_DIR"

          echo "===== ORIGINAL ROOT BUILD FILE ====="
          sed -n '1,200p' "$PROJECT_DIR/build.gradle.kts"
          echo "===== ORIGINAL APP BUILD FILE ====="
          sed -n '1,240p' "$PROJECT_DIR/app/build.gradle.kts"

          GRADLE_VERSION=""
          ORIGINAL_WORKFLOW="$PROJECT_DIR/.github/workflows/build-apk.yml"
          if [ -f "$ORIGINAL_WORKFLOW" ]; then
            echo "===== ORIGINAL PROJECT APK WORKFLOW ====="
            cat "$ORIGINAL_WORKFLOW"
            GRADLE_VERSION="$(sed -nE 's/^[[:space:]]*gradle-version:[[:space:]]*["'\''"]?([^" '\''"]+).*/\1/p' "$ORIGINAL_WORKFLOW" | head -n 1)"
          fi

          if [ -z "$GRADLE_VERSION" ]; then
            # Compatibility fallback for source archives that omit a Gradle version.
            GRADLE_VERSION="8.9"
          fi
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"
          echo "Selected existing-project Gradle version: $GRADLE_VERSION"

      - name: Set up the existing project's Gradle version
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Create temporary debug signing key when needed
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build existing debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Upload the existing app APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-existing-app-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source inventory for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Snake-source-inventory
          path: source-files.txt
          if-no-files-found: ignore
          retention-days: 7
